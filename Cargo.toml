[package]
name = "auto-login-qatar-tool"
version = "1.0.3"
edition = "2021"
description = "Qatar / QtPacker 客户端自动登录工具（Rust 复刻版）"
build = "build.rs"

[[bin]]
name = "AutoLoginQatarTool"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
