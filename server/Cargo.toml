[package]
name = "auto-login-qatar-server"
version = "1.0.6"
edition = "2021"
description = "AutoLoginQatarTool 更新服务端：版本发布与分发，带原生管理界面"
build = "build.rs"

[[bin]]
name = "AutoLoginServer"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    # 系统文件选择框（发布新版本时选 exe）在 Controls::Dialogs 下
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

# 纯 Rust 依赖，静态链接进 exe，不产生额外 DLL —— 单 exe 的约定不受影响。
# 用 serde 而不是手写 JSON：版本元数据要落盘持久化，更新说明里会有中文、引号、
# 换行，转义写错了很难发现，这类正确性不值得自己造轮子。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
